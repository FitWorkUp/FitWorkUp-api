server:
  port: ${PORT:8083}

spring:
  application:
    name: fitworkup-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET:FitWorkUp-DEV-ONLY-JWT-Key-Change-Before-Production-2026-At-Least-64-Characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  security:
    oauth2:
      client:
        registration:
          google:
            # Client ID Web usado como audience pelo token emitido ao aplicativo Android.
            client-id: 697486891515-t5ssj3akllcpddp4fi8th923que3g6fk.apps.googleusercontent.com
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - profile
              - email
